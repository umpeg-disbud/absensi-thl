<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  
  <!-- CSS Framework & Leaflet Maps -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 70px; }
    .card { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .btn-custom { border-radius: 10px; padding: 10px; }
    #map { height: 180px; border-radius: 12px; margin-top: 10px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .bottom-nav button { background: none; border: none; color: #6c757d; font-size: 12px; display: flex; flex-direction: column; align-items: center; }
    .bottom-nav button.active { color: #0d6efd; font-weight: bold; }
    .bottom-nav i { font-size: 20px; margin-bottom: 2px; }
    .fingerprint-btn { background: #0d6efd; color: white; width: 55px; height: 55px; border-radius: 50%; margin-top: -25px; box-shadow: 0 4px 10px rgba(13, 110, 253, 0.4); display: flex; align-items: center; justify-content: center; }
    .fingerprint-btn i { font-size: 26px; color: white; }
    #cameraView { width: 100%; border-radius: 12px; transform: scaleX(-1); }
  </style>
</head>
<body>

  <div class="container py-3" id="app">
    <!-- VIEW: LOGIN -->
    <div id="loginSection" class="row justify-content-center mt-5">
      <div class="col-md-5">
        <div class="card p-4">
          <h4 class="text-center fw-bold mb-3 text-primary"><i class="fa-solid me-2"></i>Absensi Online</h4>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">NIK (16 Digit)</label>
              <input type="number" id="loginNik" class="form-control" maxlength="16" placeholder="Masukkan NIK" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" id="loginPass" class="form-control" placeholder="Masukkan Password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('loginPass', 'eyeIconLogin')">
                  <i class="fa-solid fa-eye" id="eyeIconLogin"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-custom w-100">Masuk</button>
          </form>
        </div>
      </div>
    </div>

    <!-- VIEW: UTAMA -->
    <div id="mainSection" style="display: none;">
      <div class="card p-3 mb-3 bg-primary text-white">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-0 fw-bold" id="userNama">-</h5>
            <small id="userUnit">-</small>
          </div>
          <div class="text-end">
            <div id="clockDisplay" class="fw-bold fs-5">00:00</div>
            <small id="dateDisplay">-</small>
          </div>
        </div>
      </div>

      <!-- STATUS ABSENSI -->
      <div class="row g-2 mb-3">
        <div class="col-6">
          <div class="card p-3 text-center">
            <small class="text-muted">Jam Masuk</small>
            <h4 class="fw-bold text-success mb-0" id="txtJamMasuk">-</h4>
          </div>
        </div>
        <div class="col-6">
          <div class="card p-3 text-center">
            <small class="text-muted">Jam Pulang</small>
            <h4 class="fw-bold text-danger mb-0" id="txtJamPulang">-</h4>
          </div>
        </div>
      </div>

      <!-- MAPS KOORDINAT -->
      <div class="card p-3 mb-3">
        <small class="text-muted fw-bold">Lokasi GPS Saat Ini:</small>
        <div id="map"></div>
        <small class="text-muted mt-2" id="txtCoord">Mencari lokasi...</small>
      </div>
    </div>

    <!-- VIEW: REKAP -->
    <div id="rekapSection" style="display: none;">
      <h5 class="fw-bold mb-3">Rekap Presensi</h5>
      <div class="card p-3">
        <div class="table-responsive">
          <table class="table table-striped table-sm">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Masuk</th>
                <th>Pulang</th>
              </tr>
            </thead>
            <tbody id="rekapBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- VIEW: PROFIL / SETTING -->
    <div id="profileSection" style="display: none;">
      <h5 class="fw-bold mb-3">Pengaturan & Data Pribadi</h5>
      <div class="card p-3">
        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label">NIK</label>
            <input type="text" id="profNik" class="form-control" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" id="profNama" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Unit Kerja</label>
            <input type="text" id="profUnit" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Ubah Password</label>
            <div class="input-group">
              <input type="password" id="profPass" class="form-control" placeholder="Isi jika ingin merubah">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePass('profPass', 'eyeIconProf')">
                <i class="fa-solid fa-eye" id="eyeIconProf"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-success btn-custom w-100">Simpan Perubahan</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL ABSEN (CAMERA) -->
  <div class="modal fade" id="absenModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Ambil Selfie Presensi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopCamera()"></button>
        </div>
        <div class="modal-body text-center">
          <video id="cameraView" autoplay playsinline></video>
          <canvas id="canvas" style="display:none;"></canvas>
          <div class="d-flex justify-content-center gap-2 mt-3">
            <button class="btn btn-success w-50" onclick="processAbsen('masuk')">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Absen Masuk
            </button>
            <button class="btn btn-danger w-50" onclick="processAbsen('pulang')">
              <i class="fa-solid fa-right-from-bracket me-1"></i> Absen Pulang
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav" id="bottomNav" style="display: none;">
    <button onclick="switchTab('main')" id="navMain" class="active">
      <i class="fa-solid fa-house"></i>Utama
    </button>
    <button onclick="switchTab('rekap')" id="navRekap">
      <i class="fa-solid fa-calendar-check"></i>Rekap
    </button>
    <button onclick="openAbsenModal()" class="fingerprint-btn">
      <i class="fa-solid fa-fingerprint"></i>
    </button>
    <button onclick="switchTab('profile')" id="navProfile">
      <i class="fa-solid fa-user-gear"></i>Setting
    </button>
    <button onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>Keluar
    </button>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // MASUKKAN URL DEPLOY APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "URL_APPS_SCRIPT_ANDA_DI_SINI";

    let currentUser = null;
    let currentLat = 0, currentLng = 0;
    let map, marker, videoStream;
    let lastCheckedDate = "";

    // Inisialisasi saat dimuat
    document.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("user_absensi");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        loadMainView();
      }
    });

    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // HTTP POST Wrapper
    async function apiPost(data) {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      return await res.json();
    }

    // LOGIN
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nik = document.getElementById("loginNik").value;
      const password = document.getElementById("loginPass").value;

      const res = await apiPost({ action: "login", nik: nik, password: password });
      if (res.success) {
        currentUser = res.user;
        localStorage.setItem("user_absensi", JSON.stringify(currentUser));
        loadMainView();
      } else {
        alert(res.message);
      }
    });

    function loadMainView() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("mainSection").style.display = "block";
      document.getElementById("bottomNav").style.display = "flex";

      document.getElementById("userNama").innerText = currentUser.nama;
      document.getElementById("userUnit").innerText = currentUser.unitKerja;

      initGPS();
      fetchTodayData();
      startAutoRefresh();
    }

    // GPS REALTIME
    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("txtCoord").innerText = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
            
            if (!map) {
              map = L.map('map').setView([currentLat, currentLng], 16);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
              marker = L.marker([currentLat, currentLng]).addTo(map);
            } else {
              marker.setLatLng([currentLat, currentLng]);
              map.panTo([currentLat, currentLng]);
            }
          },
          (err) => alert("Harap aktifkan GPS perangkat Anda!"),
          { enableHighAccuracy: true }
        );
      }
    }

    // FETCH DATA STATUS HARIAN DARI SERVER GOOGLE
    async function fetchTodayData() {
      const res = await apiPost({ action: "getTodayStatus", nik: currentUser.nik });
      if (res.success) {
        document.getElementById("dateDisplay").innerText = res.today;
        document.getElementById("clockDisplay").innerText = res.serverTime;
        document.getElementById("txtJamMasuk").innerText = res.jamMasuk;
        document.getElementById("txtJamPulang").innerText = res.jamPulang;

        // Cek Auto Refresh Hari Berikutnya
        if (lastCheckedDate !== "" && lastCheckedDate !== res.today) {
          location.reload(); 
        }
        lastCheckedDate = res.today;
      }
    }

    function startAutoRefresh() {
      setInterval(fetchTodayData, 30000); // Polling jam server & tanggal tiap 30 detik
    }

    // KAMERA & ABSENSI
    async function openAbsenModal() {
      const modal = new bootstrap.Modal(document.getElementById('absenModal'));
      modal.show();

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById("cameraView").srcObject = videoStream;
      } catch (err) {
        alert("Gagal mengakses kamera depan!");
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    async function processAbsen(type) {
      if (!currentLat || !currentLng) {
        alert("Lokasi GPS belum didapatkan!");
        return;
      }

      // Ambil foto selfie ke base64
      const video = document.getElementById("cameraView");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);
      const photoBase64 = canvas.toDataURL("image/jpeg", 0.5);

      const modalEl = document.getElementById('absenModal');
      const modal = bootstrap.Modal.getInstance(modalEl);

      const res = await apiPost({
        action: "absen",
        nik: currentUser.nik,
        type: type,
        lat: currentLat,
        lng: currentLng,
        photo: photoBase64
      });

      if (res.success) {
        alert(res.message);
        stopCamera();
        modal.hide();
        fetchTodayData();
      } else {
        alert(res.message);
      }
    }

    // TABS SWITCHING
    function switchTab(tab) {
      document.getElementById("mainSection").style.display = tab === 'main' ? 'block' : 'none';
      document.getElementById("rekapSection").style.display = tab === 'rekap' ? 'block' : 'none';
      document.getElementById("profileSection").style.display = tab === 'profile' ? 'block' : 'none';

      document.getElementById("navMain").classList.toggle("active", tab === 'main');
      document.getElementById("navRekap").classList.toggle("active", tab === 'rekap');
      document.getElementById("navProfile").classList.toggle("active", tab === 'profile');

      if (tab === 'rekap') loadRekap();
      if (tab === 'profile') loadProfile();
    }

    async function loadRekap() {
      const res = await apiPost({ action: "getRekap", nik: currentUser.nik });
      if (res.success) {
        const tbody = document.getElementById("rekapBody");
        tbody.innerHTML = "";
        res.data.forEach(row => {
          tbody.innerHTML += `<tr>
            <td>${row.tanggal}</td>
            <td class="text-success fw-bold">${row.jamMasuk}</td>
            <td class="text-danger fw-bold">${row.jamPulang}</td>
          </tr>`;
        });
      }
    }

    function loadProfile() {
      document.getElementById("profNik").value = currentUser.nik;
      document.getElementById("profNama").value = currentUser.nama;
      document.getElementById("profUnit").value = currentUser.unitKerja;
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nama = document.getElementById("profNama").value;
      const unit = document.getElementById("profUnit").value;
      const pass = document.getElementById("profPass").value;

      const res = await apiPost({
        action: "updateProfile",
        nik: currentUser.nik,
        nama: nama,
        unitKerja: unit,
        password: pass
      });

      if (res.success) {
        alert(res.message);
        currentUser.nama = nama;
        currentUser.unitKerja = unit;
        localStorage.setItem("user_absensi", JSON.stringify(currentUser));
        loadMainView();
      } else {
        alert(res.message);
      }
    });

    function logout() {
      localStorage.removeItem("user_absensi");
      location.reload();
    }
  </script>
</body>
</html>
