<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  
  <!-- CSS Frameworks & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet Map CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { height: 180px; width: 100%; border-radius: 0.75rem; }
    #webcam { transform: scaleX(-1); object-fit: cover; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center items-center min-h-screen">

  <!-- Container Mobile -->
  <div class="w-full max-w-md bg-white min-h-screen shadow-lg flex flex-col relative pb-20">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="p-6 flex flex-col justify-center min-h-screen">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg mb-3">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Presensi Online</h1>
        <p class="text-xs text-slate-500 mt-1">Sistem Absensi Selfie & Geolocation</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">NIK (16 Digit)</label>
          <input type="text" id="loginNik" maxlength="16" placeholder="Masukkan NIK" class="w-full px-4 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">Password</label>
          <div class="relative">
            <input type="password" id="loginPass" placeholder="Masukkan Password" class="w-full px-4 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="button" onclick="togglePass('loginPass', 'eyeIconLogin')" class="absolute right-3 top-3 text-slate-400">
              <i id="eyeIconLogin" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold text-sm shadow-md transition-all">
          Masuk
        </button>
      </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen" class="hidden flex-1 flex flex-col">
      <!-- Header -->
      <div class="bg-blue-600 text-white p-5 rounded-b-2xl shadow-md">
        <div class="flex justify-between items-center">
          <div>
            <h2 id="userNama" class="font-bold text-lg leading-tight">Nama User</h2>
            <p id="userUnit" class="text-xs text-blue-100">Unit Kerja</p>
          </div>
          <div class="text-right">
            <p id="clockTgl" class="text-xs font-medium opacity-90">00-00-0000</p>
            <p id="clockJam" class="text-xl font-extrabold tracking-wider">00:00</p>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="p-4 flex-1 space-y-4">
        
        <!-- PAGE 1: HOME -->
        <div id="pageHome" class="space-y-4">
          <!-- Card Presensi -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center">
              <p class="text-xs text-emerald-600 font-semibold mb-1"><i class="fa-solid fa-right-to-bracket mr-1"></i> Jam Masuk</p>
              <p id="txtJamMasuk" class="text-lg font-bold text-emerald-800">--:--</p>
            </div>
            <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl text-center">
              <p class="text-xs text-rose-600 font-semibold mb-1"><i class="fa-solid fa-right-from-bracket mr-1"></i> Jam Pulang</p>
              <p id="txtJamPulang" class="text-lg font-bold text-rose-800">--:--</p>
            </div>
          </div>

          <!-- Peta Lokasi -->
          <div class="bg-white border border-slate-200 p-3 rounded-xl space-y-2 shadow-sm">
            <div class="flex justify-between items-center text-xs text-slate-600 font-semibold">
              <span><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> Titik Koordinat GPS</span>
              <span id="txtJarak" class="text-blue-600 font-bold">Menghitung...</span>
            </div>
            <div id="map"></div>
            <p id="txtCoords" class="text-[10px] text-slate-400 text-center">Lat: - | Lng: -</p>
          </div>
        </div>

        <!-- PAGE 2: REKAP -->
        <div id="pageRekap" class="hidden space-y-3">
          <h3 class="font-bold text-sm text-slate-700">Rekap Presensi</h3>
          <div id="rekapContainer" class="space-y-2 text-xs">
            <!-- Items Rekap Inserted via JS -->
          </div>
        </div>

        <!-- PAGE 3: DATA PRIBADI -->
        <div id="pageProfil" class="hidden space-y-3">
          <h3 class="font-bold text-sm text-slate-700">Data Pribadi</h3>
          <div class="bg-white p-4 rounded-xl border border-slate-200 text-sm space-y-2">
            <div>
              <p class="text-xs text-slate-400">NIK</p>
              <p id="pNik" class="font-semibold text-slate-700">-</p>
            </div>
            <div>
              <p class="text-xs text-slate-400">Nama Lengkap</p>
              <p id="pNama" class="font-semibold text-slate-700">-</p>
            </div>
            <div>
              <p class="text-xs text-slate-400">Unit Kerja</p>
              <p id="pUnit" class="font-semibold text-slate-700">-</p>
            </div>
          </div>
        </div>

        <!-- PAGE 4: SETTING -->
        <div id="pageSetting" class="hidden space-y-3">
          <h3 class="font-bold text-sm text-slate-700">Pengaturan Akun</h3>
          <div class="space-y-3 text-xs">
            <div>
              <label class="block mb-1 text-slate-600 font-semibold">Nama Lengkap</label>
              <input type="text" id="editNama" class="w-full p-2.5 border rounded-lg">
            </div>
            <div>
              <label class="block mb-1 text-slate-600 font-semibold">Unit Kerja</label>
              <input type="text" id="editUnit" class="w-full p-2.5 border rounded-lg">
            </div>
            <div>
              <label class="block mb-1 text-slate-600 font-semibold">Password Baru (Opsional)</label>
              <div class="relative">
                <input type="password" id="editPass" class="w-full p-2.5 border rounded-lg">
                <button type="button" onclick="togglePass('editPass', 'eyeIconEdit')" class="absolute right-3 top-2.5 text-slate-400">
                  <i id="eyeIconEdit" class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
            <button onclick="saveProfile()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold shadow-md">Simpan Perubahan</button>
          </div>
        </div>

      </div>

      <!-- MODAL ABSENSI (CAMERA & SELFIE) -->
      <div id="modalAbsen" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex flex-col justify-center items-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-4">
          <div class="flex justify-between items-center">
            <h3 id="modalTitle" class="font-bold text-sm text-slate-800">Ambil Foto Selfie</h3>
            <button onclick="closeCameraModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>
          
          <div class="relative w-full aspect-square bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="triggerAbsen('masuk')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-semibold text-xs shadow-md">
              <i class="fa-solid fa-right-to-bracket mr-1"></i> Absen Masuk
            </button>
            <button onclick="triggerAbsen('pulang')" class="bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-lg font-semibold text-xs shadow-md">
              <i class="fa-solid fa-right-from-bracket mr-1"></i> Absen Pulang
            </button>
          </div>
        </div>
      </div>

      <!-- BOTTOM NAVIGATION BAR -->
      <div class="fixed bottom-0 max-w-md w-full bg-white border-t border-slate-200 flex justify-around items-center py-2 px-1 z-40">
        <button onclick="switchTab('home')" class="nav-btn text-blue-600 flex flex-col items-center flex-1">
          <i class="fa-solid fa-house text-base"></i>
          <span class="text-[10px] mt-0.5">Utama</span>
        </button>
        <button onclick="switchTab('rekap')" class="nav-btn text-slate-400 flex flex-col items-center flex-1">
          <i class="fa-solid fa-calendar-check text-base"></i>
          <span class="text-[10px] mt-0.5">Rekap</span>
        </button>
        
        <!-- Fingerprint Action Button -->
        <button onclick="openCameraModal()" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg -mt-5 border-4 border-white active:scale-95 transition-transform">
          <i class="fa-solid fa-fingerprint text-2xl"></i>
        </button>

        <button onclick="switchTab('profil')" class="nav-btn text-slate-400 flex flex-col items-center flex-1">
          <i class="fa-solid fa-user text-base"></i>
          <span class="text-[10px] mt-0.5">Profil</span>
        </button>
        <button onclick="switchTab('setting')" class="nav-btn text-slate-400 flex flex-col items-center flex-1">
          <i class="fa-solid fa-gear text-base"></i>
          <span class="text-[10px] mt-0.5">Setting</span>
        </button>
        <button onclick="logout()" class="text-rose-500 flex flex-col items-center flex-1">
          <i class="fa-solid fa-right-from-bracket text-base"></i>
          <span class="text-[10px] mt-0.5">Keluar</span>
        </button>
      </div>

    </div>

  </div>

  <script>
    // URL WEB APP APPS SCRIPT (Ganti dengan URL Deployment Anda)
    const API_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let currentLat = null;
    let currentLng = null;
    let map = null;
    let marker = null;
    let videoStream = null;

    // Toggle Password Visibility
    function togglePass(inputId, eyeId) {
      const inp = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (inp.type === "password") {
        inp.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        inp.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Login Function
    async function doLogin() {
      const nik = document.getElementById('loginNik').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (!nik || !pass) return alert("Isi NIK dan Password!");

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', nik: nik, password: pass })
      }).then(r => r.json());

      if (res.status === 'success') {
        currentUser = res.user;
        localStorage.setItem('user_absensi', JSON.stringify(currentUser));
        initApp();
      } else {
        alert(res.message);
      }
    }

    function initApp() {
      if (!currentUser) return;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');

      document.getElementById('userNama').innerText = currentUser.nama;
      document.getElementById('userUnit').innerText = currentUser.unitKerja;
      document.getElementById('pNik').innerText = currentUser.nik;
      document.getElementById('pNama').innerText = currentUser.nama;
      document.getElementById('pUnit').innerText = currentUser.unitKerja;
      
      document.getElementById('editNama').value = currentUser.nama;
      document.getElementById('editUnit').value = currentUser.unitKerja;

      initLocation();
      fetchTodayStatus();
      initAutoRefresh();
    }

    // Leaflet GPS Map Setup
    function initLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;

          document.getElementById('txtCoords').innerText = `Lat: ${currentLat.toFixed(5)} | Lng: ${currentLng.toFixed(5)}`;

          if (!map) {
            map = L.map('map').setView([currentLat, currentLng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([currentLat, currentLng]).addTo(map);
          } else {
            marker.setLatLng([currentLat, currentLng]);
            map.panTo([currentLat, currentLng]);
          }

          // Hitung jarak ke lokasi target kantor
          if (currentUser.targetLat && currentUser.targetLng) {
            const dist = calculateDistance(currentLat, currentLng, currentUser.targetLat, currentUser.targetLng);
            document.getElementById('txtJarak').innerText = `${Math.round(dist)} Meter dari titik target`;
          }
        }, err => console.log(err), { enableHighAccuracy: true });
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // Ambil Data Jam Absen & Waktu Server Google
    async function fetchTodayStatus() {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getTodayStatus', nik: currentUser.nik })
      }).then(r => r.json());

      if (res.status === 'success') {
        document.getElementById('clockTgl').innerText = res.serverDate;
        document.getElementById('clockJam').innerText = res.serverTime;
        document.getElementById('txtJamMasuk').innerText = res.jamMasuk;
        document.getElementById('txtJamPulang').innerText = res.jamPulang;
      }
    }

    // Auto Refresh Waktu/Tanggal Server Setiap 30 Detik
    function initAutoRefresh() {
      setInterval(() => {
        fetchTodayStatus();
      }, 30000);
    }

    // Camera Modal Handlers
    async function openCameraModal() {
      document.getElementById('modalAbsen').classList.remove('hidden');
      const video = document.getElementById('webcam');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = videoStream;
      } catch (e) {
        alert("Gagal membuka kamera selfie!");
      }
    }

    function closeCameraModal() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('modalAbsen').classList.add('hidden');
    }

    // Ambil Capture Selfie dan Kirim Absen
    async function triggerAbsen(type) {
      if (!currentLat || !currentLng) return alert("Lokasi GPS belum didapatkan!");

      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageB64 = canvas.toDataURL('image/jpeg', 0.6);

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'doAbsen',
          nik: currentUser.nik,
          type: type,
          lat: currentLat,
          lng: currentLng,
          imageB64: imageB64
        })
      }).then(r => r.json());

      if (res.status === 'success') {
        alert(res.message);
        closeCameraModal();
        fetchTodayStatus();
      } else {
        alert(res.message);
      }
    }

    // Tab Navigation
    function switchTab(tabName) {
      ['Home', 'Rekap', 'Profil', 'Setting'].forEach(p => {
        document.getElementById(`page${p}`).classList.add('hidden');
      });
      document.getElementById(`page${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`).classList.remove('hidden');

      if (tabName === 'rekap') loadRekap();
    }

    // Rekap Handler
    async function loadRekap() {
      const container = document.getElementById('rekapContainer');
      container.innerHTML = "Memuat rekap...";

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getRekap', nik: currentUser.nik })
      }).then(r => r.json());

      if (res.status === 'success' && res.data.length > 0) {
        container.innerHTML = res.data.map(item => `
          <div class="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center">
            <div>
              <p class="font-bold text-slate-700">${item[1]}</p>
              <p class="text-[10px] text-slate-400">GPS: ${item[6]}</p>
            </div>
            <div class="text-right">
              <span class="text-emerald-600 font-semibold">M: ${item[4]}</span> | 
              <span class="text-rose-600 font-semibold">P: ${item[5]}</span>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = "Belum ada rekap presensi.";
      }
    }

    // Save Profile / Password
    async function saveProfile() {
      const nama = document.getElementById('editNama').value;
      const unit = document.getElementById('editUnit').value;
      const pass = document.getElementById('editPass').value;

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateProfile', nik: currentUser.nik, nama: nama, unitKerja: unit, newPassword: pass })
      }).then(r => r.json());

      if (res.status === 'success') {
        alert("Data berhasil diubah!");
        currentUser.nama = nama;
        currentUser.unitKerja = unit;
        localStorage.setItem('user_absensi', JSON.stringify(currentUser));
        initApp();
      }
    }

    function logout() {
      localStorage.removeItem('user_absensi');
      location.reload();
    }

    // Auto Login Check
    window.onload = () => {
      const saved = localStorage.getItem('user_absensi');
      if (saved) {
        currentUser = JSON.parse(saved);
        initApp();
      }
    };
  </script>
</body>
</html>
